[build]
  publish = "out"
  command = "npm run build"

# Subdomain rewrites for journals.yallavoyage.com
[[redirects]]
  from = "https://journals.yallavoyage.com/"
  to = "/travel-journal"
  status = 200
  force = true

[[redirects]]
  from = "https://journals.yallavoyage.com/travel-journal/*"
  to = "/travel-journal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://journals.yallavoyage.com/*"
  to = "/travel-journal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "http://journals.yallavoyage.com/"
  to = "/travel-journal"
  status = 200
  force = true

[[redirects]]
  from = "http://journals.yallavoyage.com/travel-journal/*"
  to = "/travel-journal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "http://journals.yallavoyage.com/*"
  to = "/travel-journal/:splat"
  status = 200
  force = true

# Long-lived caching for static assets (hashed build files never change)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed images: cache for a week, then revalidate in the background.
# To publish a replacement image immediately, give the new file a new name.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
